<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Study Mate</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap icon -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<link rel="stylesheet" th:href="@{/css/common/common.css}">
	<link rel="stylesheet" th:href="@{/css/common/header.css}">
	<link rel="stylesheet" th:href="@{/css/study/main.css}">

</head>

<body>

	<!-- 공통 Header -->
	<div th:replace="fragments/header :: header"></div>


	<main class="main-container">


		<!-- ========================
         SEARCH
    ========================= -->

		<section class="search-section">

			<div class="search-card">

				<div class="search-content">

					<div class="search-text">

						<div class="search-title-wrap">

							<img th:src="@{/assets/study_mate_logo.png}" class="search-small-logo" alt="StudyMate">

							<h2>
								같이 공부할<br>
								스터디를 찾아보세요
							</h2>

						</div>

						<form th:action="@{/}" method="get" class="search-form">

							<input type="text" name="keyword" placeholder="스터디 이름을 검색해보세요">

							<button type="submit">
								<i class="bi bi-search"></i>
							</button>

						</form>

					</div>

					<div class="search-image">
						<img th:src="@{/assets/main_people.png}" alt="스터디 이미지">
					</div>

				</div>

			</div>

		</section>



		<!-- ========================
         CATEGORY
    ========================= -->

		<section class="category-section">

			<a th:href="@{/}" class="category-btn active">
				전체
			</a>

			<a th:href="@{/(category='개발')}" class="category-btn">
				개발
			</a>

			<a th:href="@{/(category='어학')}" class="category-btn">
				어학
			</a>

			<a th:href="@{/(category='취업')}" class="category-btn">
				취업
			</a>

			<a th:href="@{/(category='독서')}" class="category-btn">
				독서
			</a>

			<a th:href="@{/(category='자격증')}" class="category-btn">
				자격증
			</a>

			<a th:href="@{/(category='기타')}" class="category-btn">
				기타
			</a>

		</section>



		<!-- ========================
         STUDY LIST HEADER
    ========================= -->

		<section class="study-section">

			<div class="study-header">

				<h3>
					모집 중인 스터디
				</h3>

				<a th:href="@{/study/create}" class="btn create-study-btn">

					+ 스터디 만들기

				</a>

			</div>

			<!-- ========================
             STUDY LIST
        ========================= -->

			<div class="study-grid">

				<a class="study-card" th:each="study : ${myStudyList}"
					th:href="@{/study/detail/{id}(id=${study.studyId})}">

					<div class="study-thumbnail">
						<img th:src="@{'/assets/thumbnails/' + ${study.thumbnail}}">
					</div>

					<div class="study-card-body">

						<div class="study-meta">
							<span class="category-badge" th:text="${study.categoryName}">
								개발
							</span>

							<span class="recruit-badge">
								모집중
							</span>
						</div>

						<h4 th:text="${study.title}">
							스터디 제목
						</h4>

						<p th:text="${study.description}">
							스터디 설명
						</p>
						<div class="study-card-footer">

							<span class="study-leader" th:classappend="${study.leaderId == #authentication.principal.memberId}
														                      ? ' my-study-leader' : ''">

								<i class="bi bi-star-fill"
									th:if="${study.leaderId == #authentication.principal.memberId}">
								</i>
								<span th:text="${study.leaderNickname}">
									스터디장
								</span>

							</span>

							<span class="member-count">
								<i class="bi bi-people-fill"></i>

								<span th:text="${study.currentMemberCount}">1</span>
								/
								<span th:text="${study.maxMember}">5</span>
							</span>
						</div>

					</div>

				</a>
			</div>

		</section>


	</main>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
