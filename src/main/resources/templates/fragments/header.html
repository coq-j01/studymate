<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="header" class="site-header">

	<div class="header-inner">

		<!-- 로고 -->
		<a th:href="@{/}" class="header-logo">
			<img th:src="@{/assets/study_mate_text.png}" alt="StudyMate">
		</a>


		<!-- 가운데 메뉴 -->
		<nav class="header-nav">

			<a th:href="@{/}" id="studyFindMenu" class="nav-link">
				스터디 찾기
			</a>

			<a th:href="@{/study/my-study}" id="myStudyMenu" class="nav-link">
				내 스터디
			</a>

		</nav>


		<!-- 사용자 영역 -->
		<div class="header-user">

			<span class="user-name"
			      sec:authentication="principal.nickname">
			    닉네임
			</span>

			<a th:href="@{/member/mypage}" class="mypage-link">
				마이페이지
			</a>

			<form th:action="@{/logout}" method="post">
				<button type="submit" class="logout-button">
					로그아웃
				</button>
			</form>

		</div>

	</div>

	<script th:src="@{/js/common/header.js}"></script>

</header>

</html>
