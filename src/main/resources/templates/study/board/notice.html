<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>공지사항 | StudyMate</title>


	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<link rel="stylesheet" th:href="@{/css/common/common.css}">

	<link rel="stylesheet" th:href="@{/css/common/header.css}">

	<link rel="stylesheet" th:href="@{/css/common/study-header.css}">

	<link rel="stylesheet" th:href="@{/css/study/board.css}">

</head>


<body>

	<header th:replace="~{fragments/header :: header}"></header>


	<main class="study-page">

		<header th:replace="~{fragments/study-header :: studyHeader(${study})}"></header>


		<section class="study-board-content">

			<section class="board-section">


				<div class="board-section-header">

					<h2>공지사항</h2>


					<!-- 공지는 스터디장만 작성 가능 -->
					<a th:if="${study.leaderId == #authentication.principal.memberId}"
						th:href="@{/study/{studyId}/notice/write(studyId=${study.studyId})}" class="write-link">

						+ 글쓰기

					</a>

				</div>


				<div class="post-list">

					<a class="notice-item" th:each="notice : ${noticeList}" th:href="@{/study/{studyId}/board/{postId}
                            (studyId=${study.studyId},
                             postId=${notice.postId})}">


						<strong th:text="${notice.title}">
							이번주 오프라인입니다!
						</strong>

						<span class="like-info">
						        <i class="bi bi-heart"></i>
						        <span th:text="${notice.likeCount}">0</span>
						    </span>

						    <span class="post-date"
						          th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">
						        2026.09.18
						    </span>

					</a>


					<div class="empty-post" th:if="${#lists.isEmpty(noticeList)}">

						등록된 공지사항이 없습니다.

					</div>

				</div>

			</section>

		</section>

	</main>

	<script th:src="@{/js/common/study-header.js}"></script>
</body>

</html>
