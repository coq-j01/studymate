<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Study Mate</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap icon -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<link rel="stylesheet" th:href="@{/css/common/common.css}">
	<link rel="stylesheet" th:href="@{/css/common/category.css}">
	<link rel="stylesheet" th:href="@{/css/common/header.css}">
	<link rel="stylesheet" th:href="@{/css/study/main.css}">

</head>

<body>

	<!-- 공통 Header -->
	<header th:replace="~{fragments/header :: header}"></header>


	<main class="main-container">

		<!-- ========================
             STUDY LIST
        ========================= -->
		<section class="study-section">
			<div class="study-grid">

				<a class="study-card" th:each="study : ${myStudyList}"
					th:href="@{/study/detail/{id}(id=${study.studyId})}">

					<div class="study-thumbnail">
						<img th:src="@{'/assets/thumbnails/' + ${study.thumbnail}}">
					</div>

					<div class="study-card-body">

						<div class="study-meta">
							<span class="category-badge"  th:classappend="' category-' + ${study.categoryId}"
							th:text="${study.categoryName}">
								개발
							</span>

							<th:block th:switch="${study.studyStatus}">

							    <span th:case="'RECRUITING'"
							          class="status-badge recruiting">
							        모집중
							    </span>

							    <span th:case="'CLOSED'"
							          class="status-badge closed">
							        모집마감
							    </span>

							    <span th:case="'ENDED'"
							          class="status-badge ended">
							        종료
							    </span>

							</th:block>
						</div>

						<h4 th:text="${study.title}">
							스터디 제목
						</h4>

						<p th:text="${study.description}">
							스터디 설명
						</p>
						<div class="study-card-footer">

							<span class="study-leader" th:classappend="${study.leaderId == #authentication.principal.memberId}
														                      ? ' my-study-leader' : ''">

								<i class="bi bi-star-fill"
									th:if="${study.leaderId == #authentication.principal.memberId}">
								</i>
								<span th:text="${study.leaderNickname}">
									스터디장
								</span>

							</span>

							<span class="member-count">
								<i class="bi bi-people-fill"></i>

								<span th:text="${study.currentMemberCount}">1</span>
								/
								<span th:text="${study.maxMember}">5</span>
							</span>
						</div>

					</div>

				</a>
			</div>

		</section>


	</main>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
