<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Mate</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/main.css}">

</head>

<body>

<!-- 공통 Header -->
<div th:replace="fragments/header :: header"></div>


<main class="main-container">


    <!-- ========================
         SEARCH
    ========================= -->

    <section class="search-section">

        <div class="search-card">

            <div class="search-text">

                <h2>
                    같이 공부할<br>
                    스터디를 찾아보세요
                </h2>

            </div>


            <!-- 검색 -->
            <form th:action="@{/}"
                  method="get"
                  class="search-form">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="스터디 이름을 검색해보세요">

                <button type="submit"
                        class="btn btn-primary">

                    검색

                </button>

            </form>

        </div>

    </section>



    <!-- ========================
         CATEGORY
    ========================= -->

    <section class="category-section">

        <a th:href="@{/}"
           class="category-btn active">
            전체
        </a>

        <a th:href="@{/(category='개발')}"
           class="category-btn">
            개발
        </a>

        <a th:href="@{/(category='어학')}"
           class="category-btn">
            어학
        </a>

        <a th:href="@{/(category='취업')}"
           class="category-btn">
            취업
        </a>

        <a th:href="@{/(category='독서')}"
           class="category-btn">
            독서
        </a>

        <a th:href="@{/(category='자격증')}"
           class="category-btn">
            자격증
        </a>

        <a th:href="@{/(category='기타')}"
           class="category-btn">
            기타
        </a>

    </section>



    <!-- ========================
         STUDY LIST HEADER
    ========================= -->

    <section class="study-section">

        <div class="study-header">

            <h3>
                모집 중인 스터디
            </h3>

            <a th:href="@{/study/create}"
               class="btn create-study-btn">

                + 스터디 만들기

            </a>

        </div>



        <!-- ========================
             STUDY LIST
        ========================= -->

        <div class="study-grid">


            <!-- 일단 기능 확인용 카드 -->
            <div class="study-card">

                <div class="study-thumbnail">
                    이미지
                </div>

                <div class="study-card-body">

                    <div class="study-tags">

                        <span class="category-tag">
                            개발
                        </span>

                        <span class="recruit-tag">
                            모집중
                        </span>

                    </div>

                    <h4>
                        토익 준비 스터디
                    </h4>

                    <p>
                        같이 꾸준히 공부하실 분 모집합니다.
                    </p>

                    <div class="study-info">
                        <span>인원 3 / 5</span>
                    </div>

                    <a th:href="@{/study/1}">
                        상세보기
                    </a>

                </div>

            </div>


            <!-- 나중에 DB 연결하면 위 카드 대신 ↓ -->

            <!--
            <div class="study-card"
                 th:each="study : ${studyList}">

                <div class="study-thumbnail">
                    <img th:src="${study.thumbnail}">
                </div>

                <div class="study-card-body">

                    <span th:text="${study.category}">
                        개발
                    </span>

                    <h4 th:text="${study.title}">
                        스터디 제목
                    </h4>

                    <p th:text="${study.description}">
                        스터디 설명
                    </p>

                    <a th:href="@{/study/{id}(id=${study.studyId})}">
                        상세보기
                    </a>

                </div>

            </div>
            -->

        </div>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
