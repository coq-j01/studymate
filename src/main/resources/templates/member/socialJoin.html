<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>추가 정보 입력 | Study Mate</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap icon -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-background">

    <div class="auth-page">

        <!-- ========================================
             LEFT
        ========================================= -->
        <section class="auth-left">

            <div class="left-content">

                <!-- 로고 -->
                <div class="logo-box">
                    <img th:src="@{/assets/study_mate_logo.png}"
                         alt="Study Mate"
                         class="auth-logo">
                </div>

                <!-- 문구 -->
                <div class="auth-copy">
                    <h1>
                        함께하면<br>
                        더 멀리 갈 수 있어요
                    </h1>

                    <p>
                        좋은 사람들과 꾸준히, 즐겁게<br>
                        지금, 당신의 스터디를 시작해 보세요
                    </p>
                </div>

            </div>

            <!-- 사람 일러스트 -->
            <div class="people-box">
                <img th:src="@{/assets/login_people.png}"
                     alt="Study Mate"
                     class="people-image">
            </div>

        </section>


        <!-- ========================================
             RIGHT
        ========================================= -->
        <section class="auth-right">

            <div class="join-form-wrap">

                <h2 class="login-title">
                    추가 정보 입력
                </h2>

                <p class="text-muted mb-4">
                    StudyMate에서 사용할 정보를 입력해 주세요.
                </p>


                <form th:action="@{/social/join}"
                      method="post"
                      id="socialJoinForm">

                    <!-- Google 이메일 -->
                    <div class="row align-items-center mb-3">

                        <label for="email"
                               class="col-4 auth-label">
                            이메일
                        </label>

                        <div class="col-8">

                            <input type="email"
                                   class="form-control auth-input"
                                   id="email"
                                   th:value="${email}"
                                   readonly>

                        </div>

                    </div>


                    <!-- Google 이름 -->
                    <div class="row align-items-center mb-3">

                        <label for="name"
                               class="col-4 auth-label">
                            이름
                        </label>

                        <div class="col-8">

                            <input type="text"
                                   class="form-control auth-input"
                                   id="name"
                                   th:value="${name}"
                                   readonly>

                        </div>

                    </div>


                    <!-- 닉네임 -->
                    <div class="row align-items-start mb-3">

                        <label for="nickname"
                               class="col-4 auth-label">
                            닉네임
                        </label>

                        <div class="col-8">

                            <input type="text"
                                   class="form-control auth-input"
                                   id="nickname"
                                   name="nickname"
                                   placeholder="닉네임을 입력해 주세요"
                                   maxlength="50"
                                   required>

                            <div id="nicknameMessage"
                                 class="validation-message"
                                 aria-live="polite">
                            </div>

                        </div>

                    </div>


                    <!-- 성별 -->
                    <div class="row align-items-center mb-4">

                        <span class="col-4 auth-label">
                            성별
                        </span>

                        <div class="col-8 d-flex gap-4">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="genderFemale"
                                       value="F"
                                       required>

                                <label class="form-check-label"
                                       for="genderFemale">
                                    여성
                                </label>

                            </div>


                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="genderMale"
                                       value="M">

                                <label class="form-check-label"
                                       for="genderMale">
                                    남성
                                </label>

                            </div>

                        </div>

                    </div>


                    <!-- 가입 완료 -->
                    <button type="submit"
                            class="btn login-btn w-100">
                        가입 완료
                    </button>

                </form>

            </div>

        </section>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
