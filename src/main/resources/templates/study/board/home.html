<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>스터디 홈 | StudyMate</title>


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/common/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/common/header.css}">

    <link rel="stylesheet"
          th:href="@{/css/common/study-header.css}">

    <link rel="stylesheet"
          th:href="@{/css/study/board.css}">

</head>


<body>

<!-- 사이트 공통 헤더 -->
<header th:replace="~{fragments/header :: header}"></header>


<main class="study-page">

    <!-- 스터디 내부 헤더 -->
    <header th:replace="~{fragments/study-header :: studyHeader(${study})}"></header>


    <section class="study-board-content">


        <!-- =========================
             공지사항
        ========================== -->

        <section class="board-section">

            <div class="board-section-header">

                <h2>공지사항</h2>


                <!-- 스터디장만 글쓰기 -->
                <a th:if="${study.leaderId == #authentication.principal.memberId}"
                   th:href="@{/study/{studyId}/notice/write(studyId=${study.studyId})}"
                   class="write-link">

                    + 글쓰기

                </a>

            </div>


            <div class="post-list">

                <a class="notice-item"
                   th:each="notice : ${recentNoticeList}"
                   th:href="@{/study/{studyId}/notice/{postId}
                            (studyId=${study.studyId},
                             postId=${notice.postId})}">

                    <strong th:text="${notice.title}">
                        이번주 오프라인입니다!
                    </strong>
					
					<!--하트 icon 들어가야함-->
					<span th:text="${post.likeCount}">0</span>

                    <span th:text="${#temporals.format(
                            notice.createdAt,
                            'yyyy.MM.dd')}">

                        2026.09.10

                    </span>

                </a>


                <!-- 공지가 없을 때 -->
                <div class="empty-post"
                     th:if="${#lists.isEmpty(recentNoticeList)}">

                    등록된 공지사항이 없습니다.

                </div>

            </div>

        </section>



        <!-- =========================
             최근 인증글
        ========================== -->

        <section class="board-section">

            <div class="board-section-header">

                <h2>최근 인증글</h2>


                <a th:href="@{/study/{studyId}/attendance/write(studyId=${study.studyId})}"
                   class="write-link">

                    + 글쓰기

                </a>

            </div>


            <div class="post-list">

                <a class="board-item"
                   th:each="post : ${recentAttendnaceList}"
                   th:href="@{/study/{studyId}/attendance/{postId}
                            (studyId=${study.studyId},
                             postId=${post.postId})}">


                    <strong class="post-title"
                            th:text="${post.title}">

                        토익 시험 등록하고 왔습니다

                    </strong>


                    <span class="post-writer"
                          th:text="${post.nickname}">

                        정채빈

                    </span>


                    <span class="post-date"
                          th:text="${#temporals.format(
                                    post.createdAt,
                                    'yyyy.MM.dd')}">

                        2026.09.18

                    </span>

                </a>


                <div class="empty-post"
                     th:if="${#lists.isEmpty(recentAttendnaceList)}">

                    등록된 인증글이 없습니다.

                </div>

            </div>

        </section>


    </section>

</main>

<script th:src="@{/js/common/study-header.js}"></script>
</body>
</html>
