<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header" class="main-header">

    <div class="header-inner">

        <!-- 로고 -->
        <a th:href="@{/}" class="header-logo">
            <img th:src="@{/assets/study_mate_logo.png}"
                 alt="Study Mate">
        </a>

        <!-- 메뉴 -->
        <nav class="header-nav">
            <a th:href="@{/}" class="nav-link">
                스터디 찾기
            </a>

            <a th:href="@{/my-study}" class="nav-link">
                내 스터디
            </a>
        </nav>

        <!-- 사용자 영역 -->
        <div class="header-user">

            <span class="user-name">
                사용자님
            </span>

            <a th:href="@{/mypage}">
                마이페이지
            </a>

            <!-- Spring Security Logout -->
            <form th:action="@{/logout}"
                  method="post"
                  class="logout-form">

                <button type="submit"
                        class="logout-btn">
                    로그아웃
                </button>

            </form>

        </div>

    </div>

</header>

</body>
</html>
