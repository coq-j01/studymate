<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>인증 게시판 | StudyMate</title>


	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<link rel="stylesheet" th:href="@{/css/common/common.css}">

	<link rel="stylesheet" th:href="@{/css/common/header.css}">

	<link rel="stylesheet" th:href="@{/css/common/study-header.css}">

	<link rel="stylesheet" th:href="@{/css/study/board.css}">

</head>


<body>

	<header th:replace="~{fragments/header :: header}"></header>


	<main class="study-page">

		<header th:replace="~{fragments/study-header :: studyHeader(${study})}"></header>


		<section class="study-board-content">

			<section class="board-section">


				<div class="board-section-header">

					<h2>인증 게시판</h2>


					<!-- 인증글은 모든 스터디원 작성 가능 -->
					<a th:href="@{/study/{studyId}/attendance/write(studyId=${study.studyId})}" class="write-link">

						+ 글쓰기

					</a>

				</div>


				<div class="post-list">


					<a class="board-item" th:each="post : ${attendanceList}" th:href="@{/study/{studyId}/board/{postId}
                            (studyId=${study.studyId},
                             postId=${post.postId})}">


						<strong class="post-title" th:text="${post.title}">

							토익 시험 등록하고 왔습니다

						</strong>

						<span class="post-writer" th:text="${post.nickname}">

							정채빈

						</span>

						<span class="like-info">
							<i class="bi bi-heart"></i>
							<span th:text="${post.likeCount}">0</span>
						</span>

						<span class="post-date" th:text="${#temporals.format(
                                    post.createdAt,
                                    'yyyy.MM.dd')}">

							2026.09.18

						</span>

					</a>


					<div class="empty-post" th:if="${#lists.isEmpty(attendanceList)}">

						등록된 인증글이 없습니다.

					</div>

				</div>
				
				<!-- ========================
				     PAGINATION
				========================= -->
				<div class="pagination"
				     th:if="${totalPages > 0}">

				    <!-- 이전 -->
				    <a class="page-btn page-arrow"
				       th:if="${currentPage > 1}"
				       th:href="@{/study/{studyId}/attendance(
				            studyId=${study.studyId},
				            page=${currentPage - 1}
				       )}">
				        <i class="bi bi-chevron-left"></i>
				    </a>

				    <span class="page-btn page-arrow disabled"
				          th:unless="${currentPage > 1}">
				        <i class="bi bi-chevron-left"></i>
				    </span>


				    <!-- 페이지 번호 -->
				    <a th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
				       class="page-btn"
				       th:classappend="${pageNum == currentPage} ? ' active' : ''"
				       th:href="@{/study/{studyId}/attendance(
				            studyId=${study.studyId},
				            page=${pageNum}
				       )}"
				       th:text="${pageNum}">
				        1
				    </a>


				    <!-- 다음 -->
				    <a class="page-btn page-arrow"
				       th:if="${currentPage < totalPages}"
				       th:href="@{/study/{studyId}/attendance(
				            studyId=${study.studyId},
				            page=${currentPage + 1}
				       )}">
				        <i class="bi bi-chevron-right"></i>
				    </a>

				    <span class="page-btn page-arrow disabled"
				          th:unless="${currentPage < totalPages}">
				        <i class="bi bi-chevron-right"></i>
				    </span>

				</div>

			</section>

		</section>

	</main>

	<script th:src="@{/js/common/study-header.js}"></script>
</body>

</html>
