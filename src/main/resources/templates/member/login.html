<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>로그인 | Study Mate</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap icon -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<!-- Custom CSS -->
	<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
	<div class="auth-background">

		<div class="auth-page">

			<!-- ======================
         LEFT
    ======================= -->
			<section class="auth-left">

				<div class="left-content">

					<!-- 로고 -->
					<div class="logo-box">
						<img th:src="@{/assets/study_mate_logo.png}" alt="Study Mate" class="auth-logo">
					</div>

					<!-- 문구 -->
					<div class="auth-copy">

						<h1>
							함께하면<br>
							더 멀리 갈 수 있어요
						</h1>

						<p>
							좋은 사람들과 꾸준히, 즐겁게<br>
							지금, 당신의 스터디를 시작해 보세요
						</p>

					</div>

				</div>


				<!-- 사람 일러스트 -->
				<div class="people-box">

					<img th:src="@{/assets/login_people.png}" alt="Study Mate" class="people-image">

				</div>

			</section>


			<!-- ======================
         RIGHT
    ======================= -->
			<section class="auth-right">

				<div class="login-form-wrap">

					<h2 class="login-title">
						로그인
					</h2>

					<form th:action="@{/login}" method="post">

						<!-- 이메일 -->
						<div class="mb-3">

							<input type="email" class="form-control auth-input" name="username"
								placeholder="이메일을 입력해 주세요" required>

						</div>


						<!-- 비밀번호 -->
						<div class="password-input-wrap">
						    <input type="password"
						           class="form-control auth-input"
						           id="password"
						           name="password"
						           placeholder="비밀번호를 입력해 주세요"
						           required>

						    <button type="button"
						            class="password-toggle"
						            data-target="password"
						            aria-label="비밀번호 보기">
						        <i class="bi bi-eye"></i>
						    </button>
						</div>


						<!-- 로그인 상태 유지 -->
						<div class="form-check remember-box">

							<input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">

							<label class="form-check-label" for="rememberMe">
								로그인 상태 유지
							</label>

						</div>


						<!-- 로그인 -->
						<button type="submit" class="btn login-btn w-100">
							로그인
						</button>

					</form>


					<!-- 구분선 -->
					<div class="login-divider">
						<span>또는</span>
					</div>


					<!-- Google -->
					<div class="text-center">

						<a href="#" class="google-btn">

							<span class="google-icon">G</span>

							<span>
								Sign in with Google
							</span>

						</a>

					</div>


					<!-- 회원가입 -->
					<div class="join-guide">

						<span>계정이 없으신가요?</span>

						<a th:href="@{/join}">
							회원가입
						</a>

					</div>

				</div>

			</section>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

	<script th:src="@{/js/member/auth.js}"></script>
</body>

</html>
