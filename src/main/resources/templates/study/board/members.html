<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">

	<title>스터디원</title>
	<!--bootstrap-->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<!-- CSRF -->
	<meta name="_csrf" th:content="${_csrf.token}">

	<meta name="_csrf_header" th:content="${_csrf.headerName}">

	<link rel="stylesheet" th:href="@{/css/common/header.css}">
	<link rel="stylesheet" th:href="@{/css/common/study-header.css}">
	<link rel="stylesheet" th:href="@{/css/study/members.css}">
</head>

<body>

	<!-- 사이트 공통 헤더 -->
	<header th:replace="~{fragments/header :: header}"></header>


	<main class="study-page">

		<!-- 기존 스터디 내부 헤더가 있다면 fragment 사용 -->
		<header th:replace="~{fragments/study-header :: studyHeader(${study})}"></header>


		<section class="member-section">

			<div class="member-section-header">

				<h2>스터디원</h2>

				<span class="member-count">
					<strong th:text="${#lists.size(memberList)}">2</strong>
					/
					<span th:text="${maxMember}">5</span>
				</span>

			</div>


			<div class="member-list">

				<article class="member-card" th:each="member : ${memberList}">

					<div class="member-card-content">

						<div class="member-name-area">

							<strong class="member-name" th:text="${member.nickname}">
								정채빈
							</strong>

							<span class="leader-badge" th:if="${member.leader}">
								스터디장
							</span>

						</div>


						<div class="member-info">

							<span th:text="${member.gender == 'M' ? '남' : '여'}">
								여
							</span>

							<span>/</span>

							<span th:text="${#temporals.format(member.joinedAt, 'yyyy.MM.dd')}">
								2026.09.18
							</span>

							<span>가입</span>

						</div>

					</div>


					<!-- 로그인한 본인이면서 스터디장이 아닐 때 -->
					<div class="leave-study-area" th:if="${!member.leader && member.memberId == loginId}">

						<button type="button" id="leaveStudyButton" class="leave-button">
							탈퇴
						</button>

					</div>

				</article>

			</div>

		</section>

	</main>

</body>
<script th:src="@{/js/common/study-header.js}"></script>
<script th:src="@{/js/study/members.js}"></script>

</html>
